[mod-setting-name]
bmsc-update-interval=运算刷新间隔（tick）

[mod-setting-description]
bmsc-update-interval=每隔多少 tick 重新读取线路并计算一次输出。Factorio 每秒运行 60 tick；默认值 30 表示每秒刷新 2 次。较大的值可降低大量运算器对 UPS 的影响，但输出响应会更慢。此项为启动设置，修改后需要重新加载模组。

[bmsc]
gui-title=市场选择运算器
mode=操作模式
mode-tooltip=选择运算器使用的计算规则。生产订单会按库存和订单输出产品及原料；订单递归会展开生产链需求；配方查询会把输入产品换算为直接原料。
select-mode=请选择模式
production-order=生产订单
production-order-settings=生产订单参数
order-recursion=超市订单
order-recursion-settings=超市订单参数
recipe-query=配方查询
recipe-query-settings=配方查询参数
recipe-query-machine=配方查询机器
recipe-query-machine-tooltip=用于限定配方制造类别的机器。配方查询不检查当前势力的科技解锁状态。
multiple-recipe-support=多配方支持
multiple-recipe-support-tooltip=否：只查询按信号名称排序后的第一个正数输入，并输出制造一份所需的原料。是：合并红绿线路的全部正数输入，按输入数量向上取整到完整制造次数，再汇总所有直接原料。
production-machine=生产机器
production-machine-tooltip=用于查找可制造配方的机器。只有当前势力已由科技解锁，并且该机器支持的配方才会参与计算。
recursion-depth=递归深度（0 表示不限制）
recursion-depth-tooltip=超市订单最多展开的配方层数。0 表示不限制深度；正整数表示最多递归对应层数。
recursion-timeout=超时时间（秒）
recursion-timeout-tooltip=仅用于“单个”输出模式。当前锁定信号的输出数量连续此时间未发生变化时，自动轮换到下一个结果。0 表示永不因超时切换；数量变化后会重新计时。
additional-rate=额外可生产倍率
additional-rate-tooltip=新订单仍仅在“库存 < 基础订单量”时启动；启动后保持锁定，直到库存达到“订单量 ×（1 + 此倍率）”。产品输出为扩展目标减去当前库存的实时缺口。这两个不同阈值构成迟滞区间，可避免频繁启停。例如订单 100、倍率 1、库存 150，已锁定订单输出 50。
material-rate=材料需求倍率
material-rate-tooltip=启动新订单所需的原料库存。每一种原料都必须严格大于“单份配方用量 × 此倍率”；等于阈值时不能启动，红线没有对应原料信号时按库存 0 处理。建议设置得高于原料保留倍率。
material-retention-rate=原料保留倍率
material-retention-rate-tooltip=订单运行后的停止阈值。任意一种原料库存严格小于“单份配方用量 × 此倍率”时停止当前订单；等于阈值时仍继续运行。建议低于材料需求倍率，以形成稳定的迟滞区间。
remember-order=订单记忆
remember-order-tooltip=是：绿色订单信号消失后仍执行已经选中的订单，直到商品达标、原料到达保留阈值或手动清空。否：订单随绿色线路实时更新。
production-timeout=超时时间（秒）
production-timeout-tooltip=监控当前锁定商品最终输出的实时缺口。该数值连续此时间没有变化时，自动轮换到下一个有效订单；库存、订单量或额外可生产倍率使缺口变化后重新计时。0 表示永不因超时切换。
yes=是
no=否
clear-order-memory=清空订单记忆
clear-order-memory-tooltip=立即放弃当前缓存的生产订单；若绿色线路仍有需求，下一个运算周期可能重新选中订单。
output-mode=输出模式
output-mode-tooltip=产品缺口会向上取整到完整制造次数，再换算实际所需原料；材料需求倍率只用于订单启动校验。仅产品、仅原料、所有会在两色线路输出对应内容。所有（信号分离）在绿线输出产品缺口，红线输出实际所需原料。
only-item=仅产品
only-material=仅原料
all=所有
all-separate-signal=所有（信号分离）
cache-grid-number=缓存格子数（0 表示不限制）
cache-grid-number-tooltip=仅用于“所有（信号分离）”。可装箱原料按完整配方批次和物品堆叠上限分配；不能维持配比的多余格子会闲置。液体及其他不可装箱原料不参与统计，0 表示不限制。若格数少于可装箱原料种类数，则不输出任何可装箱原料。
single=单个
recursion-output-mode-tooltip=单个：一次只输出一个递归结果，并记录选中时的目标库存。机械臂取走物品不会改变锁定项；达到目标或超时后再轮播下一个。所有：同时输出当前递归计算得到的全部结果。
wiring-help=生产订单/订单递归：红线为库存，绿线为生产需求；配方查询：红绿输入会合并为待查询产品。输出端可接任意颜色线路。
hover-output=输出信号：__1__
output-signals=输出信号
no-output=无
input=输入：
output=输出：
connected=已连接
connected-to=连接至：__1__
connected-to-label=连接至：
not-connected=未连接
normal-operation=正常运转
add-description=添加说明
save-description=提交说明
description=说明
