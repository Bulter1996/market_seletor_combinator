[mod-setting-name]
bmsc-update-interval=Calculation update interval (ticks)
bmsc-policy-gui-opacity=Recipe policy window opacity

[mod-setting-description]
bmsc-update-interval=Number of ticks between circuit reads and output calculations. Factorio runs at 60 ticks per second; the default of 30 updates twice per second. Higher values reduce the UPS impact of many combinators but make outputs respond more slowly. This is a startup setting, so changing it reloads the mod.
bmsc-policy-gui-opacity=Background opacity for the recipe policy popup. This is a per-player visual preference.

[string-mod-setting]
bmsc-policy-gui-opacity-100=100% (opaque)
bmsc-policy-gui-opacity-80=80%
bmsc-policy-gui-opacity-60=60%
bmsc-policy-gui-opacity-40=40%

