[mod-setting-name]
bmsc-update-interval=运算刷新间隔（tick）
bmsc-policy-gui-opacity=配方策略窗口透明度

[mod-setting-description]
bmsc-update-interval=每隔多少 tick 重新读取线路并计算一次输出。Factorio 每秒运行 60 tick；默认值 120 表示约每 2 秒刷新一次。较大的值可降低大量运算器对 UPS 的影响，但输出响应会更慢。此项为启动设置，修改后需要重新加载模组。
bmsc-policy-gui-opacity=配方策略浮层的背景透明度。该项仅影响当前玩家的界面。

[string-mod-setting]
bmsc-policy-gui-opacity-100=100%（不透明）
bmsc-policy-gui-opacity-80=80%
bmsc-policy-gui-opacity-60=60%
bmsc-policy-gui-opacity-40=40%

[bmsc]
gui-title=市场选择运算器
runtime-page=运行
config-page=配置
