recipe-query-machine-tooltip=Machine used to restrict recipe crafting categories. Recipe query does not check whether the current force has unlocked the recipe.
inventory-query=Inventory query
inventory-query-settings=Shared inventory query settings
swap-order=Swap order
swap-order-settings=Swap order settings
swap-output-mode=Output mode
swap-only-fluid=Fluids only
swap-only-item=Items only
swap-all=All (excluding virtual signals)
swap-all-with-signals=All (including virtual signals)
swap-timeout=Timeout (seconds)
swap-timeout-tooltip=Switch to the next permutation after the timeout conditions remain fulfilled for this duration. Zero disables timing and outputs immediately according to Output mode; an unfulfilled condition or changed input restarts the timer.
timeout-elapsed=Current elapsed time (seconds)
conditions=Conditions
add-condition=+ Add condition
clear-swap=Clear swap
or=OR
and=AND
query-type=Query mode
query-type-tooltip=Restricts the shared inventory signal type. The restriction applies both to input-driven queries and Query all.
query-only-fluid=Fluids only
query-only-item=Items only
query-unrestricted=Unrestricted
query-all=Query all
query-all-tooltip=No (default): emit shared inventory only for matching signals present on either input wire. Yes: ignore input and emit every non-zero entry allowed by Query mode. This mode works only while LinkedChestAndPipe is installed and enabled; otherwise it ignores all input and emits nothing.
multiple-recipe-support=Multiple recipe support
multiple-recipe-support-tooltip=Single: query only the first positive input in signal-name order and emit ingredients for one craft. All: merge all positive inputs from both wire colors, round each product up to complete crafts, and aggregate all direct ingredients.
production-machine=Production machine
production-machine-tooltip=Machine used to find craftable recipes. Only recipes unlocked for the current force and supported by this machine are considered.
recursion-depth=Recursion depth (0 means unlimited)
recursion-depth-tooltip=Maximum number of recipe levels expanded by supermarket order. Zero means unlimited; a positive integer limits recursion to that many levels.
recursion-timeout=Timeout (seconds)
recursion-timeout-tooltip=Used only in Single mode. If the locked signal's output amount remains unchanged for this duration, switch to the next result. Zero disables timeout switching; an amount change or fulfilled conditions below restart the timer.
sequential-production=Sequential production
sequential-production-tooltip=Used only in Single mode. Yes: sort orders stably and permanently advance after each completed order, without going back if its product is later consumed. Input changes or Restart from beginning reset the scan. No: recurse all orders together and prioritize the deepest missing material.
restart-sequence=Restart from beginning
restart-sequence-tooltip=Clear sequential-production progress and scan again from the first sorted order. Changing the order inputs also restarts automatically.
additional-rate=Additional production rate
additional-rate-tooltip=A new order still starts only while stock is below its base amount. Once started, it remains locked until stock reaches “order amount × (1 + this rate)”. Product output is the live gap to that extended target. These separate thresholds provide hysteresis and prevent rapid toggling. For an order of 100, rate 1, and stock 150, a locked order outputs 50.
material-rate=Material demand rate
material-rate-tooltip=Ingredient stock required to start a new order. Every ingredient must be strictly greater than “one-craft amount × this rate”; equality does not start an order, and a missing red-wire signal counts as zero stock. This should normally exceed the retention rate.
material-retention-rate=Material retention rate
material-retention-rate-tooltip=Stop threshold for a running order. It stops when any ingredient is strictly below “one-craft amount × this rate”; equality keeps the order running. Keep this below the demand rate to create a stable hysteresis range.
recursion-additional-rate-tooltip=Extended target for the final product and every craftable intermediate. A level starts below its base target and stops at “base target × (1 + this rate)”; each level applies this independently to prevent recipe-chain oscillation.
recursion-material-rate-tooltip=Start threshold for each recursive production level. Every direct ingredient must be strictly greater than “one-craft amount × this rate”; equality continues expanding toward lower-level materials.
recursion-material-retention-rate-tooltip=Retention threshold for the current recursive production level. It falls back to lower-level materials when any direct ingredient is strictly below “one-craft amount × this rate”; equality keeps the current level active.
remember-order=Remember order
remember-order-tooltip=Yes: continue the selected order after its green-wire signal disappears, until product stock is reached, ingredients reach retention, or memory is cleared. No: follow green-wire demand in real time.
production-timeout=Timeout (seconds)
production-timeout-tooltip=Monitors the locked product's live output gap. If it remains unchanged for this duration, rotate to the next eligible order; stock, order, rate changes, or fulfilled conditions below restart the timer. Zero disables timeout switching.
timeout-reset-conditions=Timeout reset conditions
yes=Yes
no=No
clear-order-memory=Clear remembered order
clear-order-memory-tooltip=Immediately forget the current order. If demand remains on the green wire, it may be selected again on the next update.
output-mode=Output mode
output-mode-tooltip=The product gap is rounded up to complete crafts to calculate actual required ingredients; the material demand rate is only a start condition. Products only, Materials only, and All emit their content on both wire colors. All (separate signals) emits the product gap on green and actual ingredients on red.
only-item=Products only
only-material=Materials only
all=All
all-separate-signal=All (separate signals)
cache-grid-number=Cache slots
cache-grid-number-tooltip=Used only by All (separate signals). Cacheable ingredients are allocated as complete recipe batches using item stack sizes; extra slots that cannot preserve the ratio remain unused. Fluids and other non-cacheable ingredients are ignored, and zero means unlimited. If there are fewer slots than cacheable ingredient types, no cacheable ingredient is emitted.
recipe-query-cache-grid-number-tooltip=Used only when Multiple recipe support is All. Zero preserves the original full output; a non-zero value allocates complete craft batches proportionally across recipe requirements using item stack sizes. Extra slots that cannot preserve ratios remain unused, and fluids or other non-cacheable ingredients are not counted.
single=Single
recursion-output-mode-tooltip=Single: emit one recursive result at a time, prioritizing the deepest material, and remember its target stock. Inserters removing items do not change the locked result; select another after reaching the target or timing out. All: emit every current shortage for products, intermediate products, and raw materials, ordered from the deepest materials first.
wiring-help=Production order/order recursion: red is inventory and green is demand. Recipe query merges both inputs. Inventory query selects shared stock. Swap order merges both inputs and rotates signal order when its conditions time out. Either output wire color may be used.
