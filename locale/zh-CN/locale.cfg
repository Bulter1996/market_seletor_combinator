work-material-full=原料充足
work-material-ready=原料较多
work-material-low=原料较少
work-local=本机
work-network=网络
mode=操作模式
mode-tooltip=选择运算器使用的计算规则。生产订单会按库存和订单输出产品及原料；订单递归会展开生产链需求；配方查询会把输入产品换算为直接原料；查询模式会读取 LinkedChestAndPipe 的共享区库存。
mode-tooltip-production-order=按红线库存和绿线订单选择一项生产；输出模式决定产品与原料信号。
mode-tooltip-supermarket-order=按绿线订单递归展开生产链；“单个”一次输出一个当前缺口，“全部”同时输出全部缺口。
mode-tooltip-recipe-query=将红绿输入的产品或配方换算为当前生产机器可用配方的直接原料。
mode-tooltip-inventory-query=按输入信号查询关联箱和关联管共享区库存；可选直接输出全部库存。
mode-tooltip-swap-order=锁定合并输入的前两个信号；超时后在独立红绿输出之间交换。
select-mode=请选择模式
production-order=生产订单
production-order-settings=生产订单参数
supermarket-order=超市订单
supermarket-order-settings=超市订单参数
order-params=订单参数
timeout-settings=超时设置
recipe-query=配方查询
recipe-query-settings=配方查询参数
recipe-query-machine=配方查询机器
recipe-query-machine-tooltip=用于限定配方制造类别的机器。配方查询不检查当前势力的科技解锁状态。
inventory-query=查询模式
inventory-query-settings=共享区库存查询参数
swap-order=切换订单
swap-order-settings=切换订单参数
swap-output-mode=输出模式
swap-only-fluid=仅液体
swap-only-item=仅物品
swap-all=全部（不含信号）
swap-all-with-signals=全部（含信号）
swap-timeout=超时时间（秒）
swap-timeout-tooltip=所有超时时间重置条件持续不满足达到此时间后，交换两个锁定信号的红绿输出；0 表示禁用交换。候选信号首次按数量降序排列，同量时按信号 ID 排序；之后仅数量变化不会改变锁定结果和计时。当前红线位置输出排名 101，绿线位置输出排名 102。
swap-loop=循环
swap-loop-tooltip=默认不勾选：交换一次后停止，直到候选信号种类变化或点击“重新选择”。勾选后，每次超时都会再次交换两个信号。
timeout-elapsed=当前计时时间（秒）
conditions=条件
add-condition=＋ 添加条件
clear-swap=重新选择
clear-swap-tooltip=立即按当前数量重新排列候选信号、锁定前两项、恢复初始红绿方向，并重新开始超时计时。
or=或者
and=并且
query-type=查询模式
query-type-tooltip=限制共享区库存的查询种类；按输入查询和“查询全部”都会应用此限制。
query-only-fluid=仅流体
query-only-item=仅物体
query-unrestricted=不限制
query-all=查询全部
query-all-tooltip=否（默认）：只输出红绿输入中符合查询模式的信号在共享区的库存。是：忽略输入并输出符合查询模式的全部非零库存。仅安装并启用 LinkedChestAndPipe 时生效；否则本模式不处理输入，也不产生输出。
multiple-recipe-support=多配方支持
multiple-recipe-support-tooltip=单个：只查询按信号名称排序后的第一个正数输入，并输出制造一份所需的原料。所有：合并红绿线路的全部正数输入，按输入数量向上取整到完整制造次数，再汇总所有直接原料。
production-machine=生产机器
production-machine-tooltip=用于查找可制造配方的机器。只有当前势力已由科技解锁，并且该机器支持的配方才会参与计算。
inventory-validation=库存校验
inventory-validation-linked=库存校验（自动匹配关联箱）
inventory-validation-none=不校验
inventory-validation-tooltip=库存校验：使用红线库存，订单或缺口物品没有当前机器已解锁配方时暂时跳过。自动匹配关联箱：额外定向查询“关联箱和关联管”的共享区库存，并与红线数量相加；负信号可以抵扣，结果最低为 0，查询结果受关联箱同步频率影响。不校验：原料始终视为满足，直接输出订单产品或指定配方；产品库存仍用于判断订单完成。
recursion-depth=递归深度
recursion-depth-tooltip=超市订单最多展开的配方层数。0 表示不限制深度；正整数表示最多递归对应层数。
recursion-timeout=超时时间（秒）
recursion-timeout-tooltip=仅用于“单个”输出模式。计时达到此时间后自动轮换到下一个结果；若只有当前一个结果，则先解除锁定并立即按材料需求倍率重新判断。0 表示永不因超时切换；是否由当前输出数量变化重新计时取决于下方参数，线路条件不受其影响。
material-wait-time=原料等待时间（秒）
material-wait-time-tooltip=仅用于“单个”输出模式。只要已经实际输出过信号，后续因原料不足、严格校验、订单完成、输入变化或生产链候选改变而准备撤销或切换时，都继续保持上一输出至此时间结束。0 表示立即采用新结果。
sequential-production=顺序制作
sequential-production-tooltip=仅用于“单个”输出模式。是：按信号名称稳定排序并循环扫描；当前订单完成后推进到下一项，到达末尾后回到第一项重新检查需求。否：同时递归全部订单，并优先输出递归层级最深的缺口。无论是否顺序制作，右键输入信号页中当前绿色订单可切换到下一个排队订单，左键双击等待订单可把它设为当前项。
restart-sequence=从头开始
restart-sequence-tooltip=立即清除当前顺序选择，并从排序后的第一个订单重新检查。订单输入发生变化时也会自动从头开始。
additional-rate=额外可生产倍率
generation-rate=生成倍率
material-range=原料倍率
additional-rate-tooltip=新订单仍仅在“库存 < 基础订单量”时启动；启动后保持锁定，直到库存达到“订单量 ×（1 + 此倍率）”。产品输出为扩展目标减去当前库存的实时缺口。这两个不同阈值构成迟滞区间，可避免频繁启停。例如订单 100、倍率 1、库存 150，已锁定订单输出 50。
material-rate=材料需求倍率
material-rate-tooltip=启动新订单所需的原料库存。每一种原料都必须严格大于“单份配方用量 × 此倍率”；等于阈值时不能启动，红线没有对应原料信号时按库存 0 处理。建议设置得高于原料保留倍率。
material-retention-rate=原料保留倍率
material-retention-rate-tooltip=订单运行后的停止阈值。任意一种原料库存严格小于“单份配方用量 × 此倍率”时停止当前订单；等于阈值时仍继续运行。建议低于材料需求倍率，以形成稳定的迟滞区间。
recursion-additional-rate-tooltip=最终产品及每层可制造中间产品的扩展目标。最终产品达到“基础目标 ×（1 + 此倍率）”时完成；“单个”模式下，已启动的递归中间产物会保持到库存严格大于实际采用的扩展目标，或任一直接原料跌破保留阈值。
recursion-material-rate-tooltip=进入某一递归生产层的启动阈值。该层每一种直接原料都必须严格大于“单份配方用量 × 此倍率”；等于阈值时继续向下补料。中间产物先使用整单的额外生产目标；仅当“父配方单份用量 × 此倍率”大于该目标时，才改用“父配方单份用量 ×（1 + 此倍率）”，不会把此倍率再次乘订单总量。
recursion-material-retention-rate-tooltip=当前递归生产层的保留阈值。任意直接原料库存小于等于“单份配方用量 × 此倍率”时，当前配方不可继续，重新选择可执行节点。
recursion-material-range-tooltip=左侧为原料保留倍率，右侧为原料需求倍率。保留倍率决定已启动生产何时停止；需求倍率决定新生产何时启动。右值必须大于左值。
remember-order=订单记忆
remember-order-tooltip=是：绿色订单信号消失后仍执行已经选中的订单，直到商品达标、原料到达保留阈值或手动清空。否：订单随绿色线路实时更新。
production-timeout=超时时间（秒）
production-timeout-tooltip=计时达到此时间后，把当前订单移到等候队列末尾并选择下一个有效订单；其他订单完成后仍沿队列继续，不会立刻回到刚超时的订单。0 表示永不因超时切换；是否由当前商品输出数量变化重新计时取决于下方参数，线路条件不受其影响。
monitor-item-quantity-changes=监控物品数量变化
monitor-item-quantity-changes-tooltip=是（默认）：当前制作或输出信号的数量变化时重置超时时间。否：忽略数量变化，仅在切换当前信号或满足超时时间重置条件时重新计时。
timeout-reset-conditions=超时时间重置条件
yes=是
no=否
clear-order-memory=清空订单记忆
clear-order-memory-tooltip=立即放弃当前缓存的生产订单；若绿色线路仍有需求，下一个运算周期可能重新选中订单。
output-mode=输出模式
output-mode-tooltip=产品缺口会向上取整到完整制造次数，再换算实际所需原料；材料需求倍率只用于订单启动校验。仅产品、仅原料、所有会在两色线路输出对应内容。所有（信号分离）在绿线输出产品缺口，红线输出实际所需原料。
only-item=仅产品
only-material=仅原料
all=所有
all-separate-signal=所有（信号分离）
cache-grid-number=缓存格子数
cache-grid-number-tooltip=仅用于“所有（信号分离）”。可装箱原料按完整配方批次和物品堆叠上限分配；不能维持配比的多余格子会闲置。液体及其他不可装箱原料不参与统计，0 表示不限制。若格数少于可装箱原料种类数，则不输出任何可装箱原料。
recipe-query-cache-grid-number-tooltip=仅在“多配方支持”为“所有”时生效。0 保持原有完整输出；非 0 时按各配方需求比例和物品堆叠上限分配完整制造批次。无法维持配比的多余格子闲置，液体及其他不可装箱原料不参与统计。
single=单个
recursion-output-mode-tooltip=单个：一次只输出一个递归结果，优先选择递归层级最深的材料，并记录选中时的目标库存。机械臂取走物品不会改变锁定项；达到目标或超时后再选择下一项。在输入信号页右键当前绿色订单可切换到下一个排队订单，左键双击等待订单可把它设为当前项；两种操作都不经过原料等待时间。所有：同时输出产品、中间产物和基础原料的全部当前缺口，并按递归深度从基础原料开始排列。
wiring-help=生产订单/订单递归：红线为库存，绿线为生产需求；Shift＋左键点击绿色订单信号可选择生产配方和库存校验产物；配方查询：红绿输入会合并为待查询产品，Shift＋左键点击任一输入信号可选择配方；查询模式：红绿输入指定库存种类；切换订单：锁定合并输入的前两项，超时后在独立红绿输出间交换。输出端可接任意颜色线路。
