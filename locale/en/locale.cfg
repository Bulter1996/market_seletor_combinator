[bmsc]
gui-title=Market selector combinator
mode=Operation mode
mode-tooltip=Selects the calculation rule. Production order emits products and ingredients from stock and demand; order recursion expands the production chain.
select-mode=Select a mode
production-order=Production order
production-order-settings=Production order settings
order-recursion=Order recursion
order-recursion-settings=Order recursion settings
production-machine=Production machine
production-machine-tooltip=Machine used to find craftable recipes. Only recipes unlocked for the current force and supported by this machine are considered.
recursion-depth=Recursion depth (0 means unlimited)
recursion-depth-tooltip=Maximum number of recipe levels expanded by order recursion. Zero means unlimited; a positive integer limits recursion to that many levels.
recursion-timeout=Timeout (seconds)
recursion-timeout-tooltip=Used only in Single mode. If the locked signal's output amount remains unchanged for this duration, switch to the next result. Zero disables timeout switching; any amount change restarts the timer.
additional-rate=Additional production rate
additional-rate-tooltip=A new order still starts only while stock is below its base amount. Once started, it remains locked until stock reaches “order amount × (1 + this rate)”. Product output is the live gap to that extended target. These separate thresholds provide hysteresis and prevent rapid toggling. For an order of 100, rate 1, and stock 150, a locked order outputs 50.
material-rate=Material demand rate
material-rate-tooltip=Ingredient stock required to start a new order. Every ingredient must be strictly greater than “one-craft amount × this rate”; equality does not start an order, and a missing red-wire signal counts as zero stock. This should normally exceed the retention rate.
material-retention-rate=Material retention rate
material-retention-rate-tooltip=Stop threshold for a running order. It stops when any ingredient is strictly below “one-craft amount × this rate”; equality keeps the order running. Keep this below the demand rate to create a stable hysteresis range.
remember-order=Remember order
remember-order-tooltip=Yes: continue the selected order after its green-wire signal disappears, until product stock is reached, ingredients reach retention, or memory is cleared. No: follow green-wire demand in real time.
production-timeout=Timeout (seconds)
production-timeout-tooltip=Monitors the locked product's live output gap. If it remains unchanged for this duration, rotate to the next eligible order; a change caused by stock, order amount, or additional production rate restarts the timer. Zero disables timeout switching.
yes=Yes
no=No
clear-order-memory=Clear remembered order
clear-order-memory-tooltip=Immediately forget the current order. If demand remains on the green wire, it may be selected again on the next update.
output-mode=Output mode
output-mode-tooltip=Products only: emit the live gap “order amount × (1 + additional production rate) − current stock”. Materials only: emit recipe ingredients and requested amounts. All: emit both the product gap and ingredients.
only-item=Products only
only-material=Materials only
all=All
single=Single
recursion-output-mode-tooltip=Single: emit one recursive result and remember its target stock. Inserters removing items do not change the locked result; advance after reaching the target or timing out. All: emit every current recursive result.
wiring-help=Input: red wire is inventory, green wire is demand. Either wire color may be used on the output.
