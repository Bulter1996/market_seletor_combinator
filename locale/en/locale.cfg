swap-order-settings=Swap order settings
swap-output-mode=Output mode
swap-only-fluid=Fluids only
swap-only-item=Items only
swap-all=All (excluding virtual signals)
swap-all-with-signals=All (including virtual signals)
swap-timeout=Timeout (seconds)
swap-timeout-tooltip=Swap the two locked signals between the red and green outputs after no timeout-reset condition has been fulfilled for this duration. Zero disables swapping. Eligible signal types are initially ranked by amount, with signal ID breaking ties; amount changes then preserve the locked signals and timer. The current red position emits rank 101 and the green position emits rank 102.
swap-loop=Loop
swap-loop-tooltip=Off by default: swap once and stop until the eligible signal types change or Reselect is clicked. When enabled, every timeout swaps the two signals again.
timeout-elapsed=Current elapsed time (seconds)
conditions=Conditions
add-condition=+ Add condition
clear-swap=Reselect
clear-swap-tooltip=Immediately rank the current eligible signals again, lock the first two, restore the initial red/green direction, and restart timeout timing.
or=OR
and=AND
query-type=Query mode
query-type-tooltip=Restricts the shared inventory signal type. The restriction applies both to input-driven queries and Query all.
query-only-fluid=Fluids only
query-only-item=Items only
query-unrestricted=Unrestricted
query-all=Query all
query-all-tooltip=No (default): emit shared inventory only for matching signals present on either input wire. Yes: ignore input and emit every non-zero entry allowed by Query mode. This mode works only while LinkedChestAndPipe is installed and enabled; otherwise it ignores all input and emits nothing.
multiple-recipe-support=Multiple recipe support
multiple-recipe-support-tooltip=Single: query only the first positive input in signal-name order and emit ingredients for one craft. All: merge all positive inputs from both wire colors, round each product up to complete crafts, and aggregate all direct ingredients.
production-machine=Production machine
production-machine-tooltip=Machine used to find craftable recipes. Only recipes unlocked for the current force and supported by this machine are considered.
inventory-validation=Inventory validation
inventory-validation-linked=Inventory validation (auto-match linked storage)
inventory-validation-none=No validation
inventory-validation-tooltip=Inventory validation: use red-wire inventory and temporarily skip an order when its product or a missing ingredient has no unlocked recipe for the selected machine. Auto-match linked storage: additionally query only the required signals from LinkedChestAndPipe shared storage and add red-wire values; negative signals subtract stock and the result is clamped to zero. Results follow LinkedChestAndPipe's synchronization frequency. No validation: treat ingredients as available and directly output the order product or selected recipe; product stock still completes the order.
recursion-depth=Recursion depth
recursion-depth-tooltip=Maximum number of recipe levels expanded by supermarket order. Zero means unlimited; a positive integer limits recursion to that many levels.
recursion-timeout=Timeout (seconds)
recursion-timeout-tooltip=Used only in Single mode. Switch to the next result when the timer reaches this duration. If the current result is the only one, unlock it and immediately recheck it with the material demand rate. Zero disables timeout switching; the option below controls whether output amount changes restart the timer, while circuit conditions remain independent.
material-wait-time=Ingredient wait time (seconds)
material-wait-time-tooltip=Used only in Single mode. Once a signal has actually been emitted, keep that previous output for this duration before cancelling or switching it because of ingredient shortage, strict validation, order completion, input changes, or a production-chain candidate change. Zero applies the new result immediately.
sequential-production=Sequential production
sequential-production-tooltip=Used only in Single mode. Yes: sort orders stably and scan them in a loop; after the current order completes, advance to the next, and return to the first after reaching the end. No: recurse all orders together and prioritize the deepest missing material. In either mode, right-click the active green order in the input signal panel to select the next queued order, or double-left-click a waiting order to make it current.
restart-sequence=Restart from beginning
restart-sequence-tooltip=Clear the current sequential selection immediately and scan again from the first sorted order. Changing the order inputs also restarts automatically.
additional-rate=Additional production rate
generation-rate=Generation rate
material-range=Material range
additional-rate-tooltip=A new order still starts only while stock is below its base amount. Once started, it remains locked until stock reaches “order amount × (1 + this rate)”. Product output is the live gap to that extended target. These separate thresholds provide hysteresis and prevent rapid toggling. For an order of 100, rate 1, and stock 150, a locked order outputs 50.
material-rate=Material demand rate
material-rate-tooltip=Ingredient stock required to start a new order. Every ingredient must be strictly greater than “one-craft amount × this rate”; equality does not start an order, and a missing red-wire signal counts as zero stock. This should normally exceed the retention rate.
material-retention-rate=Material retention rate
material-retention-rate-tooltip=Stop threshold for a running order. It stops when any ingredient is strictly below “one-craft amount × this rate”; equality keeps the order running. Keep this below the demand rate to create a stable hysteresis range.
recursion-additional-rate-tooltip=Extended target for the final product and every craftable intermediate. The final product completes upon reaching “base target × (1 + this rate)”. In Single mode, a running recursive intermediate remains selected until its stock is strictly greater than the applicable extended target, or a direct ingredient falls below its retention threshold.
recursion-material-rate-tooltip=Start threshold for each recursive production level. Every direct ingredient must be strictly greater than “one-craft amount × this rate”; equality continues expanding toward lower-level materials. An intermediate first uses the whole-order additional-production target. Only when “one parent craft amount × this rate” is greater does it use “one parent craft amount × (1 + this rate)”; this rate is never multiplied by the whole order again.
recursion-material-retention-rate-tooltip=Retention threshold for the current recursive production level. At or below “one-craft amount × this rate” for any direct ingredient, the current recipe becomes unavailable and an executable node is selected again.
recursion-material-range-tooltip=The left value is the material retention rate and the right value is the material demand rate. Retention keeps an active production running; demand starts a new production. The right value must exceed the left value.
remember-order=Remember order
remember-order-tooltip=Yes: continue the selected order after its green-wire signal disappears, until product stock is reached, ingredients reach retention, or memory is cleared. No: follow green-wire demand in real time.
production-timeout=Timeout (seconds)
production-timeout-tooltip=When the timer reaches this duration, move the current order to the end of the waiting queue and select the next eligible order. Completing later orders continues through the queue instead of immediately returning to the timed-out order. Zero disables timeout switching; the option below controls whether product output changes restart the timer, while circuit conditions remain independent.
monitor-item-quantity-changes=Monitor item quantity changes
monitor-item-quantity-changes-tooltip=Yes (default): restart the timeout when the current product or output signal amount changes. No: ignore amount changes and restart only when the current signal changes or the timeout reset conditions are fulfilled.
timeout-reset-conditions=Timeout reset conditions
yes=Yes
no=No
clear-order-memory=Clear remembered order
clear-order-memory-tooltip=Immediately forget the current order. If demand remains on the green wire, it may be selected again on the next update.
output-mode=Output mode
output-mode-tooltip=The product gap is rounded up to complete crafts to calculate actual required ingredients; the material demand rate is only a start condition. Products only, Materials only, and All emit their content on both wire colors. All (separate signals) emits the product gap on green and actual ingredients on red.
only-item=Products only
only-material=Materials only
all=All
all-separate-signal=All (separate signals)
cache-grid-number=Cache slots
cache-grid-number-tooltip=Used only by All (separate signals). Cacheable ingredients are allocated as complete recipe batches using item stack sizes; extra slots that cannot preserve the ratio remain unused. Fluids and other non-cacheable ingredients are ignored, and zero means unlimited. If there are fewer slots than cacheable ingredient types, no cacheable ingredient is emitted.
recipe-query-cache-grid-number-tooltip=Used only when Multiple recipe support is All. Zero preserves the original full output; a non-zero value allocates complete craft batches proportionally across recipe requirements using item stack sizes. Extra slots that cannot preserve ratios remain unused, and fluids or other non-cacheable ingredients are not counted.
single=Single
recursion-output-mode-tooltip=Single: emit one recursive result at a time, prioritizing the deepest material, and remember its target stock. Inserters removing items do not change the locked result; select another after reaching the target or timing out. In the input signal panel, right-click the active green order to select the next queued order, or double-left-click a waiting order to make it current; both actions switch immediately without applying the ingredient wait time. All: emit every current shortage for products, intermediate products, and raw materials, ordered from the deepest materials first.
wiring-help=Production order/order recursion: red is inventory and green is demand. Shift+left-click a green order signal to choose its recipe and inventory-validation products. Recipe query merges both inputs; Shift+left-click either input color to choose a recipe. Inventory query selects shared stock. Swap order locks the top two merged inputs and swaps them between separate red and green outputs after a timeout. Either output wire color may be used.
