mode=Operation mode
mode-tooltip=Selects the calculation rule. Production order emits products and ingredients from stock and demand; order recursion expands the production chain; recipe query converts input products into direct ingredients; inventory query reads LinkedChestAndPipe shared storage.
mode-tooltip-production-order=Select one production order from red inventory and green demand; output mode chooses product and material signals.
mode-tooltip-supermarket-order=Expand green orders through their production chains. Single emits one current shortage; All emits every shortage.
mode-tooltip-recipe-query=Convert red and green product or recipe inputs into direct ingredients for the selected production machine.
mode-tooltip-inventory-query=Read matching shared inventory from LinkedChestAndPipe; optionally output every available inventory signal.
mode-tooltip-swap-order=Lock the first two merged input signals and swap their separated red and green outputs after a timeout.
